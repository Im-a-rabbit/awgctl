[package]
name = "awgctl"
version = "0.1.0"
description = "Manage AmneziaWG servers"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2.0.19"
toml = "1.1.3"
wireguard-conf = { git = "https://github.com/Im-a-rabbit/wireguard-conf", features = [
  "amneziawg",
  "serde",
] }
sudo2 = "0.2"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = [
  "serde",
  "serde-human-readable",
  "local-offset",
] }
network-interface = "2"
